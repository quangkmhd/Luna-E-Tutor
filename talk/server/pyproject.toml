[project]
name = "talk"
version = "0.1.0"
description = "Voice AI bot built with Pipecat"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[evals,google,runner,silero,soniox,webrtc]==1.11.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
