name: free_talk_audio

user:
  modality: audio
  speech:
    service: kokoro
    voice: af_heart
    sample_rate: 16000

judge:
  modality: audio
  transcription:
    service: moonshine
    model: small-streaming

scenarios:
  - name: free_talk_audio_conversation
    turns:
      - expect:
          - event: response

      - user: "I like dogs."
        expect:
          - event: response

      - user: "Em chưa hiểu từ loyal."
        expect:
          - event: response

      - user: "Can we talk about school instead?"
        expect:
          - event: response
