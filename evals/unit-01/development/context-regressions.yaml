    evaluator_gold: {response_kind: asks_teacher, meaning_status: not_demonstrated}
    allowed_feedback_actions: [answer_teacher_question]
    expected_state_effects: {count_attempt: false, activity_id: free-talk.conversation}
    teacher_criteria: [answers_school_yard_from_prior_context, does_not_invent_home_or_park]
