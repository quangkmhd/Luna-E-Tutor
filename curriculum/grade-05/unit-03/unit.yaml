id: grade05.unit03
grade: 5
unit: 3
title: "My foreign friends"
content_files: [lesson-01/content.yaml, lesson-02/content.yaml, lesson-03/content.yaml, level-02/content.yaml, level-03/content.yaml, free-talk/content.yaml]
opening:
  stage:
    id: warm-up
    title: "Welcome to My foreign friends"
    exits: [lesson-01]
    prerequisite_stage_ids: []
    completion_rule: all_required_activities_handled
  activities:
  - id: warm-up.hello
    stage_id: warm-up
    kind: greeting
    objective_ids: []
    required: true
    max_attempts: 1
    completion_rule: {mode: delivered, model_repetitions: 0}
    instruction: "Greet Quang warmly without teaching target vocabulary."
    examples: ["Hi Quang!"]
  - id: warm-up.feelings
    stage_id: warm-up
    kind: emotion_check
    objective_ids: []
    required: true
    max_attempts: 2
    completion_rule: {mode: interaction, model_repetitions: 0}
    instruction: "Ask how Quang feels; accept Vietnamese and do not teach vocabulary."
    examples: ["How are you today?"]
  - id: warm-up.start
    stage_id: warm-up
    kind: bridge
    objective_ids: []
    required: false
    max_attempts: 1
    completion_rule: {mode: delivered, model_repetitions: 0}
    instruction: "Bridge to fictional foreign friends without introducing targets."
    examples: ["Let's meet some fictional friends."]
closing:
  stage:
    id: summary
    title: "Celebrate and save progress"
    exits: [finish]
    prerequisite_stage_ids: []
    completion_rule: all_required_activities_handled
  activities:
  - id: summary.reflect
    stage_id: summary
    kind: summary
    objective_ids: []
    required: true
    max_attempts: 1
    completion_rule: {mode: delivered, model_repetitions: 0}
    instruction: "End the role, praise naturally, and report only evidenced progress."
    examples: ["Scene done!"]
