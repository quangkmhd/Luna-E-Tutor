id: grade05.unit04
grade: 5
unit: 4
greeting: "Hi! My name is Luna — I'm your English tutor!"
title: Our free-time activities
content_files:
- lesson-01/content.yaml
- lesson-02/content.yaml
- lesson-03/content.yaml
- level-02/content.yaml
- level-03/content.yaml
- free-talk/content.yaml
opening:
  stage:
    id: warm-up
    title: Welcome
    exits:
    - lesson-01
    prerequisite_stage_ids: []
    completion_rule: all_required_activities_handled
  activities:
  - id: warm-up.hello
    stage_id: warm-up
    kind: greeting
    objective_ids: []
    required: true
    max_attempts: 1
    completion_rule:
      mode: delivered
      model_repetitions: 0
    instruction: Greet Quang without teaching vocabulary.
    examples:
    - Hi Quang!
  - id: warm-up.feelings
    stage_id: warm-up
    kind: emotion_check
    objective_ids: []
    required: true
    max_attempts: 2
    completion_rule:
      mode: interaction
      model_repetitions: 0
    instruction: Ask how Quang feels; accept Vietnamese.
    examples:
    - How are you today?
  - id: warm-up.start
    stage_id: warm-up
    kind: bridge
    objective_ids: []
    required: false
    max_attempts: 1
    completion_rule:
      mode: delivered
      model_repetitions: 0
    instruction: Bridge to free-time activities.
    examples:
    - Let us talk about free time.
closing:
  stage:
    id: summary
    title: Celebrate and save progress
    exits:
    - finish
    prerequisite_stage_ids: []
    completion_rule: all_required_activities_handled
  activities:
  - id: summary.reflect
    stage_id: summary
    kind: summary
    objective_ids: []
    required: true
    max_attempts: 1
    completion_rule:
      mode: delivered
      model_repetitions: 0
    instruction: Report only evidenced progress and praise naturally.
    examples:
    - Scene done!
