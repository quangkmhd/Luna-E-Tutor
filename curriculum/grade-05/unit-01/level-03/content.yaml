  - amusement-park
  evidence_criteria: Understand or use amusement park in context; imitation alone is not independent use.
- id: unit01.level03.pattern.describe_countryside
  description: 'Pattern: I live in the countryside. It''s calm and the air is fresh.'
  pattern_ids:
  - describe-countryside
  evidence_criteria: State where the learner lives and give at least one quality or feature
    of that place. A location plus one quality is sufficient; the learner does not need
    both calm and fresh air, or every detail in the example. Do not impose countryside
    or any example fact on a learner who lives elsewhere.
- id: unit01.level03.pattern.however
  description: 'Pattern: I live in a big city; however, it is very crowded.'
  pattern_ids:
  - however
  evidence_criteria: Express two contrasting aspects of the learner's town, such as a benefit
    and a drawback. A single property alone is partially_satisfied, even when it answers
    the Teacher's easier choice question or repeats an earlier answer. The word town/city
    is not a second contrasting aspect. Do not supply missing facts from Teacher examples.
    Record however usage separately from the success of the contrast.
- id: unit01.level03.pattern.moreover
  description: 'Pattern: My town has good schools; moreover, there is an amusement park.'
  pattern_ids:
  - moreover
  evidence_criteria: Add another positive fact about the town. Record moreover usage separately from meaning.
