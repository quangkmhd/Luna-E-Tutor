- id: level-03.home-description
  stage_id: level-03
  kind: guided_response
  objective_ids:
  - unit01.level03.pattern.describe_countryside
  required: true
  max_attempts: 2
  completion_rule:
    mode: communicative_turn
    model_repetitions: 0
  instruction: Invite a description of the learner’s own home environment; city and countryside answers
    are both valid.
  examples:
  - I live in the countryside. It's calm and the air is fresh.
- id: level-03.contrast
  stage_id: level-03
  kind: guided_response
  objective_ids:
  - unit01.level03.pattern.however
  required: true
  max_attempts: 2
  completion_rule:
    mode: communicative_turn
    model_repetitions: 0
  instruction: Give one short example with a positive feature before however and a drawback after it,
    then invite Quang to share a drawback. Use the activity examples as models. Being big or small alone
    is not the positive feature; busy and noisy are two related drawbacks, not a contrast.
    Do not infer use of however merely from hearing Luna model it.
  examples:
  - My city has good schools; however, it is very crowded.
  - My village is peaceful; however, there are not many shops.
- id: level-03.addition
  stage_id: level-03
  kind: guided_response
  objective_ids:
  - unit01.level03.pattern.moreover
  required: true
  max_attempts: 2
  completion_rule:
    mode: communicative_turn
    model_repetitions: 0
  instruction: Model moreover as an addition, then invite one more good thing about the learner’s town.
  examples:
  - My town has good schools; moreover, there is an amusement park.
- id: level-03.use-cottage
  stage_id: level-03
  kind: guided_response
  objective_ids:
  - unit01.level03.vocabulary.cottage
  required: true
  max_attempts: 2
  completion_rule:
    mode: communicative_turn
    model_repetitions: 0
  instruction: Create a contextual opportunity for this target. Accept the learner’s own facts; offer
    support at most twice.
  examples:
  - Is there a cottage near your home?
- id: level-03.use-vehicles
  stage_id: level-03
