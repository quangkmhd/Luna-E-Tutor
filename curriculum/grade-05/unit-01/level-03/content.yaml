patterns:
- id: describe-countryside
  text: I live in the countryside. It's calm and the air is fresh.
  acceptable_alternatives:
  - My home is in the countryside. It is peaceful.
- id: however
  text: I live in a big city; however, it is very crowded.
  # Teaching examples make the positive/negative contrast explicit; preserve the source pattern above.
  acceptable_alternatives:
  - My city is exciting, but it is crowded.
- id: moreover
  text: My town has good schools; moreover, there is an amusement park.
  acceptable_alternatives:
  - My town has good schools and also a park.
