  required: true
  max_attempts: 1
  completion_rule:
    mode: user_end
    model_repetitions: 0
  instruction: Announce Luna is playing Emma from England. Meet for the first time; follow Quang’s interests
    with short questions and invite him to ask Emma. Weave at most one relevant pending review target
    into a turn; cancel a planned prompt if he independently uses it. End on user request even if review
    remains open; save those items for next time. Announce the end of the role.
  examples:
  - Now I'm going to play a character — I'm Emma from England!
  - Hi! I’m Emma. Can you tell me about yourself?
  - What is one good thing about your town?
  - Tell me more.
