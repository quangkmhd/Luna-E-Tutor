stage:
  id: level-02
  title: Level 02
  exits:
  - level-03
  prerequisite_stage_ids: []
  completion_rule: all_required_activities_handled
vocabulary:
- id: birthday
  text: birthday
  usage: taught
- id: hobby
  text: hobby
  usage: taught
- id: phone-number
  text: phone number
  usage: taught
- id: subject
  text: subject
  usage: taught
patterns:
- id: birthday
  text: When's your birthday? – It's in ___.
  acceptable_alternatives:
  - My birthday is in May.
- id: hobby
  text: What's your hobby? – My hobby is ___.
  acceptable_alternatives:
  - I enjoy playing table tennis.
  - I like playing table tennis.
objectives:
- id: unit01.level02.vocabulary.birthday
  description: 'Vocabulary: birthday'
  vocabulary_ids:
  - birthday
  evidence_criteria: Understand or use birthday in context; imitation alone is not independent use.
- id: unit01.level02.vocabulary.hobby
  description: 'Vocabulary: hobby'
  vocabulary_ids:
  - hobby
  evidence_criteria: Understand or use hobby in context; imitation alone is not independent use.
- id: unit01.level02.vocabulary.phone_number
  description: 'Vocabulary: phone number'
  vocabulary_ids:
  - phone-number
  evidence_criteria: Understand or use phone number in context; imitation alone is not independent use.
- id: unit01.level02.vocabulary.subject
  description: 'Vocabulary: subject'
  vocabulary_ids:
  - subject
  evidence_criteria: Understand or use subject in context; imitation alone is not independent use.
- id: unit01.level02.pattern.birthday
  description: 'Pattern: When''s your birthday? – It''s in ___.'
  pattern_ids:
  - birthday
  evidence_criteria: Give a birthday month; a month alone satisfies meaning but does not demonstrate the
    full form. Do not request full birth date.
- id: unit01.level02.pattern.hobby
  description: 'Pattern: What''s your hobby? – My hobby is ___.'
  pattern_ids:
  - hobby
  evidence_criteria: Describe an enjoyable activity; accept a valid alternative without recast. Record
    target-form evidence separately.
activities:
- id: level-02.introduce-birthday
  stage_id: level-02
  kind: vocabulary_introduction
  objective_ids:
  - unit01.level02.vocabulary.birthday
  required: true
  max_attempts: 2
  completion_rule:
    mode: vocabulary_turn
    model_repetitions: 2
  instruction: Model birthday twice, invite Quang to say the target word (not answer a topic question yet), wait, then give evidence-based feedback and
    bridge. After at most two attempts move on and queue unresolved learning for review. Do not claim
    phoneme accuracy from text.
  examples:
  - birthday
- id: level-02.introduce-hobby
  stage_id: level-02
  kind: vocabulary_introduction
  objective_ids:
  - unit01.level02.vocabulary.hobby
  required: true
  max_attempts: 2
  completion_rule:
    mode: vocabulary_turn
    model_repetitions: 2
  instruction: Model hobby twice, invite Quang to say the target word (not answer a topic question yet), wait, then give evidence-based feedback and bridge.
    After at most two attempts move on and queue unresolved learning for review. Do not claim phoneme
    accuracy from text.
  examples:
  - hobby
- id: level-02.introduce-phone-number
  stage_id: level-02
  kind: vocabulary_introduction
  objective_ids:
  - unit01.level02.vocabulary.phone_number
  required: true
  max_attempts: 2
  completion_rule:
    mode: vocabulary_turn
    model_repetitions: 2
  instruction: Model phone number twice, invite Quang to say the target word (not answer a topic question yet), wait, then give evidence-based feedback
    and bridge. After at most two attempts move on and queue unresolved learning for review. Do not claim
    phoneme accuracy from text. Practise only the words or fictional examples; never ask for a real phone
    number.
  examples:
  - phone number
- id: level-02.introduce-subject
  stage_id: level-02
  kind: vocabulary_introduction
  objective_ids:
  - unit01.level02.vocabulary.subject
  required: true
  max_attempts: 2
  completion_rule:
    mode: vocabulary_turn
    model_repetitions: 2
  instruction: Model subject twice, invite Quang to say the target word (not answer a topic question yet), wait, then give evidence-based feedback and bridge.
    After at most two attempts move on and queue unresolved learning for review. Do not claim phoneme
    accuracy from text.
  examples:
  - subject
- id: level-02.birthday
  stage_id: level-02
  kind: guided_response
  objective_ids:
  - unit01.level02.pattern.birthday
  required: true
  max_attempts: 2
  completion_rule:
    mode: communicative_turn
    model_repetitions: 0
  instruction: Ask which month Quang's birthday is in, then wait for his answer.
  examples:
  - When's your birthday? – It's in May.
- id: level-02.hobby
  stage_id: level-02
  kind: guided_response
  objective_ids:
  - unit01.level02.pattern.hobby
  required: true
  max_attempts: 2
  completion_rule:
    mode: communicative_turn
    model_repetitions: 0
  instruction: Ask about a hobby, accepting natural alternatives such as I enjoy playing table tennis.
  examples:
  - What's your hobby? – My hobby is table tennis.
- id: level-02.subject
  stage_id: level-02
  kind: guided_response
  objective_ids:
  - unit01.lesson02.pattern.favourite
  - unit01.level02.vocabulary.subject
  required: true
  max_attempts: 2
  completion_rule:
    mode: communicative_turn
    model_repetitions: 0
  instruction: Ask about a favourite school subject.
  examples:
  - What's your favourite animal? – It's a dolphin.
  - What's your favourite colour? – It's pink.
  - What's your favourite food? – It's a sandwich.
- id: level-02.ask-luna
  stage_id: level-02
  kind: ask_teacher
  objective_ids:
  - unit01.level02.pattern.hobby
  required: true
  max_attempts: 2
  completion_rule:
    mode: ask_teacher
    model_repetitions: 0
  instruction: Invite Quang to ask Luna about her hobby or birthday month. Do not ask for contact information.
  examples:
  - What's your hobby? – My hobby is table tennis.
