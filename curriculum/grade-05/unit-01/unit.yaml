id: grade05.unit01
grade: 5
unit: 1
title: All about me!
content_files:
- lesson-01/content.yaml
- lesson-02/content.yaml
- lesson-03/content.yaml
- level-02/content.yaml
- level-03/content.yaml
- free-talk/content.yaml
opening:
  stage:
    id: warm-up
    title: Welcome Quang
    exits:
    - lesson-01
    prerequisite_stage_ids: []
    completion_rule: all_required_activities_handled
  activities:
  - id: warm-up.hello
    stage_id: warm-up
    kind: greeting
    objective_ids: []
    required: true
    max_attempts: 1
    completion_rule:
      mode: delivered
      model_repetitions: 0
    instruction: Greet Quang warmly. On the first meeting introduce Luna as his English tutor.
    examples:
    - Hi! Great to see you again!
  - id: warm-up.feelings
    stage_id: warm-up
    kind: emotion_check
    objective_ids: []
    required: true
    max_attempts: 2
    completion_rule:
      mode: interaction
      model_repetitions: 0
    instruction: Ask how Quang feels. Acknowledge emotion, allow a short or Vietnamese answer, and offer
      a gentle choice after silence. Do not teach vocabulary.
    examples:
    - How are you today?
  - id: warm-up.start
    stage_id: warm-up
    kind: bridge
    objective_ids: []
    # Kept for persisted sessions; new sessions bridge directly after feelings.
    required: false
    max_attempts: 1
    completion_rule:
      mode: delivered
      model_repetitions: 0
    instruction: Bridge directly to Lesson 1, adjusting pace to the learner’s mood.
    examples:
    - Great! Let’s start.
closing:
  stage:
    id: summary
    title: Celebrate and save progress
    exits:
    - finish
    prerequisite_stage_ids: []
    completion_rule: all_required_activities_handled
  activities:
  - id: summary.reflect
    stage_id: summary
    kind: summary
    objective_ids: []
    required: true
    max_attempts: 1
    completion_rule:
      mode: delivered
      model_repetitions: 0
    instruction: End the Emma role, acknowledge evidenced successes, summarize what Quang actually did,
      and preserve unresolved review for next time. Do not claim mastery from imitation.
    examples:
    - Scene done!
    - Cô rất tự hào vì con đã nói tiếng Anh hôm nay.
