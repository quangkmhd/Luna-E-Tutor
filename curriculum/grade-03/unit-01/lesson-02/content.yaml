lesson: 2
title: Hỏi thăm sức khỏe và cảm ơn
items:
- type: practice
  say: <en>Hi! Great to see you again! How are you today?</en>
  learner_goal: Học sinh đáp lời hỏi How are you? bằng một trạng thái hoặc cảm xúc thật bằng tiếng Anh, như Fine,
    Great, OK, Happy, Tired hoặc I'm ...; lời chào kèm câu trả lời cũng đạt.
- type: practice
  say: |-
    <vi>Trạm 1 nhé: hôm nay có bốn từ mới để hỏi thăm nhau, và mấy từ nói về cảm xúc của con. [long pause]</vi>
    <en>*How*</en><vi> nghĩa là thế nào, ra sao. Con nghe không — </vi><en>*how*</en><vi> cũng bắt đầu bằng hơi thở giống </vi><en>hello</en><vi> hôm qua! [long pause]</vi>
    <en>Listen first! [long pause] "*HOW*"</en>
    <en>Your turn now! *How*!</en>
  learner_goal: Học sinh nói từ How bằng tiếng Anh. Không đánh giá âm /h/ từ transcript chữ.
  image_url: /images/grade-03/unit-01/lesson-02/V07_how_are_you.webp
- type: practice
  say: |-
    <en>*You*</en><vi> là bạn — người con đang nói chuyện cùng. Khi cô nói với con, </vi><en>*You*</en><vi> chính là con. [long pause]</vi>
    <en>Listen first! [long pause] "*YOU*"</en>
    <en>Your turn now! *You*!</en>
  learner_goal: Học sinh nói từ You bằng tiếng Anh trong lượt luyện đúng từ này.
  image_url: /images/grade-03/unit-01/lesson-02/F02_your_turn_microphone.webp
- type: practice
  say: |-
    <en>*Fine*</en><vi> là khoẻ, ổn. [long pause]</vi>
    <en>Listen first! [long pause] "*FINE*"</en>
    <en>Your turn now! *Fine*!</en>
  learner_goal: Học sinh nói từ Fine bằng tiếng Anh; không đánh giá âm /n/ cuối từ transcript chữ.
  image_url: /images/grade-03/unit-01/lesson-02/V08_fine.webp
- type: practice
  say: |-
    <en>*Thank you*</en><vi> là cảm ơn — con nói khi ai hỏi thăm hay giúp con. Cô phát âm chậm: </vi><en>*THANK YOU*</en><vi> — đầu lưỡi đặt nhẹ giữa hai hàm răng. [long pause]</vi>
    <en>Listen first! [long pause] "*THANK YOU*"</en>
    <en>Now you!</en>
  learner_goal: Học sinh nói đủ cụm Thank you bằng tiếng Anh. Không đánh giá âm /th/ từ transcript chữ.
  image_url: /images/grade-03/unit-01/lesson-02/V14_thank_you.webp
- type: practice
  say: |-
    <en>*Great*</en><vi> là tuyệt, rất tốt. </vi><en>*OK*</en><vi> là bình thường, ổn. [long pause]</vi>
    <en>Listen first! [long pause] "*GREAT*" "*OK*"</en>
    <en>Your turn now! "*Great*" ,"*OK*"!</en>
  learner_goal: Học sinh nói cả hai từ Great và OK bằng tiếng Anh; chỉ một từ thì chưa đủ lượt luyện hai từ.
  image_url: /images/grade-03/unit-01/lesson-02/V09_great.webp
- type: practice
  say: |-
    <en>*Tired*</en><vi> là mệt, </vi><en>*sleepy*</en><vi> là buồn ngủ, </vi><en>*happy*</en><vi> là vui — con dùng để nói con đang thấy thế nào. [long pause]</vi>
    <en>Listen first! [long pause] "*TIRED*" "*SLEEPY*" "*HAPPY*"</en>
    <en>Your turn now!</en>
  learner_goal: Học sinh nói các từ Tired, Sleepy và Happy bằng tiếng Anh; có thể dùng trong câu ngắn, nhưng thiếu
    một từ thì chưa hoàn thành lượt luyện ba từ.
  image_url: /images/grade-03/unit-01/lesson-02/V11_tired.webp
- type: practice
  say: |-
    <en>Let's play! *Happy* — laugh. *Tired* — sigh. *Fine* — say OK! [long pause]</en>
    <en>Great!… *Tired*… *Fine*… *Happy*!</en>
  learner_goal: Học sinh nói được các từ cảm xúc Great, Tired, Fine và Happy khi được gọi tên trong trò chơi; có
    thể trả lời bằng từ đơn, không đánh giá tiếng cười hoặc tiếng thở dài từ transcript chữ.
  image_url: /images/grade-03/unit-01/lesson-02/G02_emotion_guessing_game.webp
- type: practice
  say: |-
    <vi>Trạm 2: cô trò mình ghép các từ vừa học thành một câu hỏi thăm hoàn chỉnh. [long pause]</vi>
    <en>Here's our secret question! Listen first: [long pause] "How are you?"</en>
    <vi>Nghĩa là: Bạn có khoẻ không? — con hỏi khi gặp người quen. [long pause]</vi>
    <en>Your turn now! Can you say: How are you?</en>
  learner_goal: Học sinh hỏi đủ câu How are you? bằng tiếng Anh. Một câu kể về cảm xúc của mình không thay thế câu
    hỏi.
  image_url: /images/grade-03/unit-01/lesson-02/V07_how_are_you.webp
- type: practice
  say: <en>Once more, smoothly! [long pause] "How are you?"</en>
  learner_goal: Học sinh nói lại câu hỏi How are you? bằng tiếng Anh; không chấm độ liền mạch hoặc phát âm từ transcript
    chữ.
- type: practice
  say: |-
    <en>Listen first! [long pause] "Fine, thank you."</en>
    <vi>Nghĩa là: Mình khoẻ, cảm ơn — con trả lời khi ai hỏi </vi><en>How are you.</en><vi> [long pause]</vi>
    <en>Your turn now!</en>
  learner_goal: Học sinh đáp bằng Fine, thank you bằng tiếng Anh; Fine đơn lẻ cũng đạt ở lượt luyện trả lời cơ bản
    này.
  image_url: /images/grade-03/unit-01/lesson-02/V08_fine.webp
- type: practice
  say: <en>Now for real! How are you?</en>
  learner_goal: Học sinh trả lời câu hỏi How are you? bằng trạng thái thật bằng tiếng Anh, như Fine, I'm fine, Great,
    OK, Happy hoặc Tired; không bắt buộc nói Fine nếu cảm xúc khác.
- type: practice
  say: <vi>Con không phải lúc nào cũng nói </vi><en>fine</en><vi> đâu. Hôm nay con thấy thế nào thật sự? </vi><en>Tell
    me — how are you really?</en>
  learner_goal: Học sinh nói cảm xúc thật của mình bằng tiếng Anh, có thể là Fine, Great, Happy, Tired, Sleepy hoặc
    I'm [cảm xúc]. Không tự suy ra cảm xúc của học sinh.
  image_url: /images/grade-03/unit-01/lesson-02/G02_emotion_guessing_game.webp
- type: practice
  say: <en>Really?! Tell me more about that!</en>
  learner_goal: Học sinh nói thêm một ý có nghĩa về cảm xúc vừa nêu; câu ngắn bằng tiếng Anh hoặc tiếng Việt đều
    đạt vì lượt này chỉ mời chia sẻ thêm.
- type: practice
  say: |-
    <en>Listen first! [long pause] "Fine, thank you. And you?"</en>
    <en>And you</en><vi> nghĩa là: còn bạn thì sao? — hỏi lại cho lịch sự. [long pause]</vi>
    <en>Your turn now!</en>
  learner_goal: Học sinh nói lời đáp Fine, thank you và hỏi lại And you? bằng tiếng Anh. Chỉ nói Fine thì đạt ý
    trả lời nhưng chưa đạt mục tiêu luyện hỏi lại.
  image_url: /images/grade-03/unit-01/lesson-02/V07_how_are_you.webp
- type: practice
  say: '<en>Now your turn to *ask* ME! Say: How are you?</en>'
  learner_goal: Học sinh chủ động hỏi Luna How are you? bằng tiếng Anh; có thể gọi tên Luna. Chỉ tự nói mình khỏe
    thì chưa đạt mục tiêu đặt câu hỏi.
  image_url: /images/grade-03/unit-01/lesson-02/V07_how_are_you.webp
- type: practice
  say: <en>I'm great, thank you! And you?</en>
  learner_goal: Học sinh đáp lời Luna hỏi And you? bằng trạng thái hoặc cảm xúc của mình bằng tiếng Anh, chẳng hạn
    I'm fine, Great hoặc OK.
- type: practice
  say: |-
    <vi>Trạm 3: cô trò mình nói chuyện bằng tiếng Anh nhé! </vi><en>Let's talk, just like every evening! [long pause]</en>
    <en>Good evening!</en>
  learner_goal: Học sinh đáp lời chào Good evening của Luna bằng Good evening, Hello hoặc Hi; chưa cần trả lời về
    cảm xúc ở lượt này.
  image_url: /images/grade-03/unit-01/lesson-02/S06_evening_video_call.webp
- type: practice
  say: <en>How are you today?</en>
  learner_goal: Học sinh trả lời How are you today? bằng cảm xúc hoặc trạng thái của mình bằng tiếng Anh; có thể
    hỏi lại And you?, nhưng không bắt buộc.
- type: practice
  say: |-
    <en>I'm great, thank you! [long pause]</en>
    <en>Now I'm going to play a character — I'm Tom from England! [long pause]</en>
    <en>Hi. I'm Tom.</en>
  learner_goal: Học sinh chào nhân vật Tom bằng Hi hoặc Hello; có thể tự giới thiệu tên bằng I'm [tên], nhưng lời
    chào Tom đã đủ cho lượt này.
  image_url: /images/grade-03/unit-01/lesson-02/C01_tom.webp
- type: practice
  say: <en>Nice to meet you, too! How are you?</en>
  learner_goal: Học sinh trả lời How are you? bằng cảm xúc hoặc trạng thái của mình bằng tiếng Anh; có thể hỏi lại
    And you?.
- type: end
  say: <en>I'm great, thanks! [long pause] Scene done! You just had a real conversation in English! 🎉</en>
  image_url: /images/grade-03/unit-01/lesson-02/F01_praise_star.webp

