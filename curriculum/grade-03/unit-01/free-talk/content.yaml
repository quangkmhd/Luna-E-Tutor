  max_attempts: 1
  completion_rule:
    mode: user_end
  instruction: 'Announce the fictional Mia role once. Have a short greeting conversation inspired by the workbook:
    greeting, feelings, a question back, then goodbye. Follow Quang naturally, review at most one relevant
    goal, accept pretend personal details, and never demand a real name, age, location, or family information.
    End the role when requested.'
  examples:
  - Hi! How are you today?
  - I'm great, thanks. And you?
