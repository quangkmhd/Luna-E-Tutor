stage:
  id: free-talk
  title: 'Free Talk: Meet a friend'
  exits:
  - summary
  prerequisite_stage_ids:
  - lesson-01
  - lesson-02
  - lesson-03
  - level-02
  - level-03
  completion_rule: user_end
  role:
    name: Mia
    country: Vietnam
    announce_start: true
    announce_end: true
  review:
    rank_by:
    - contextual_relevance
    - importance
    - required_support
    - recency
    max_items_per_turn: 1
    cancel_if_independently_demonstrated: true
    allow_unresolved_on_exit: true
