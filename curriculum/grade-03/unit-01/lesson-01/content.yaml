lesson: 1
title: Chào hỏi và giới thiệu tên
items:
- type: practice
  say: |-
    <en>Hi! My name is Luna. I'm your English tutor!</en>
    <vi>Xin chào con! Cô là Luna, gia sư tiếng Anh của con.</vi>
    <en>We're going to practice speaking English together. Ready?</en>
  learner_goal: Học sinh xác nhận đã sẵn sàng bắt đầu, chẳng hạn Ready, Yes, OK hoặc Vâng, Dạ. Chỉ chào lại
    mà chưa trả lời câu hỏi Ready thì chưa đạt.
  image_url: /images/grade-03/unit-01/lesson-01/C00_luna_intro.webp
- type: practice
  say: |-
    <vi>Hôm nay cô trò mình học cách chào hỏi bằng tiếng Anh — gặp ai con cũng biết chào và giới thiệu tên mình.</vi>
    <vi>Con đã biết câu chào tiếng Anh nào chưa?</vi>
  learner_goal: Học sinh nói một lời chào đã biết, chẳng hạn Hello, Hi hoặc Xin chào. Chỉ đáp Có mà chưa nói
    lời chào thì chưa đạt.
- type: practice
  say: |-
    <en>Excellent! You already know some English!</en>
    <vi>Trước khi học bài mới, cô trò mình khởi động bằng bài Starter con đã học nhé.</vi>
    <en>First, let's count! One, two, three…</en>
  learner_goal: Học sinh tiếp tục đếm bằng tiếng Anh từ four đến ten theo thứ tự; thiếu hoặc sai một đến hai
    số vẫn đạt lượt ôn. Chỉ lặp one, two, three thì chưa đạt.
- type: practice
  say: <en>Now letters. Listen first! H.</en>
  learner_goal: Học sinh nhắc lại tên chữ cái H bằng tiếng Anh; transcript có thể ghi H hoặc aitch. Không kết luận
    phát âm chuẩn hay chưa chỉ từ transcript chữ.
- type: practice
  say: <en>And B.</en>
  learner_goal: Học sinh nhắc lại tên chữ cái B bằng tiếng Anh; transcript có thể ghi B hoặc bee. Không kết luận
    phát âm chuẩn hay chưa chỉ từ transcript chữ.
- type: narration
  say: <en>Remember H! It starts today's big word.</en>
- type: practice
  say: |-
    <vi>Cô trò mình sang Trạm 1 học từ mới. Mỗi từ, cô nói nghĩa rồi đọc trước, con đọc theo cô nhé!</vi>
    <en>[long pause] "*HELLO*"</en><vi> nghĩa là xin chào, con nói khi gặp bất kỳ ai như bạn bè, thầy cô, hay cô Luna.</vi>
    <en>[long pause] Listen first! [long pause] "*HELLO*" </en>
    <en>[long pause] Your turn now! Can you say: [long pause] [slowly] "*Hello*"?</en>
  learner_goal: Học sinh nói từ Hello bằng tiếng Anh. Một lời chào khác như Hi chưa đạt lượt luyện đúng từ Hello.
  image_url: /images/grade-03/unit-01/lesson-01/V01_hello.webp
- type: practice
  say: <en>Once more! [long pause] "Hello"</en>
  learner_goal: Học sinh nói lại từ Hello bằng tiếng Anh; không cần thêm câu khác.
- type: practice
  say: |-
    <vi>Cô phát âm chậm nhé: </vi>
    <en>[long pause] "H-HELLO"</en><vi> </vi>
    <vi>[long pause] Con đặt tay trước miệng thấy hơi ấm phả ra không? Đó là âm giống như một hơi thở. [long pause]</vi>
    <en>Now you!</en>
  learner_goal: Học sinh nói từ Hello bằng tiếng Anh; không kết luận âm /h/ rõ hay chưa chỉ từ transcript chữ.
  image_url: /images/grade-03/unit-01/lesson-01/P01_h_hello.webp
- type: practice
  say: |-
    <en>[long pause] "*Hi*"</en><vi> [long pause] cũng là xin chào, nhưng ngắn và thân mật hơn, con dùng với bạn bè.</vi>
    <en>Listen first! [long pause] "*Hi*"</en>
    <en>Your turn now! [long pause][slowly] "*Hi*"</en>
  learner_goal: Học sinh nói từ Hi bằng tiếng Anh. Hello có nghĩa gần giống nhưng chưa đạt lượt luyện đúng từ Hi.
  image_url: /images/grade-03/unit-01/lesson-01/V02_hi.webp
- type: practice
  say: |-
    <en>[long pause] "I"</en><vi> [long pause] nghĩa là mình khi con nói về chính con.</vi>
    <en>[long pause] "*I'm*"</en><vi> [long pause] nghĩa là 'mình là'. Cuối chữ, con ngậm môi lại:</vi>
    <en>[long pause] "I'mm"</en>
    <en>Listen first! [long pause] "*I'm*"</en>
    <en>Your turn now! Can you say: [long pause][slowly] "*I'm*"?</en>
  learner_goal: Học sinh nói cụm I'm bằng tiếng Anh; có thể thêm tên do học sinh tự chọn. Không đánh giá âm /m/
    cuối từ transcript chữ.
  image_url: /images/grade-03/unit-01/lesson-01/V03_im_mai.webp
- type: practice
  say: |-
    <en>Well done! Look here now.</en>
    <en>Meet your book friends: Ben, Mai, Minh!</en>
  learner_goal: Học sinh nhắc lại tên ba nhân vật Ben, Mai, Minh; không đánh giá phát âm tên riêng từ transcript chữ.
  image_url: /images/grade-03/unit-01/lesson-01/V04_ben_mai_minh.webp
- type: practice
  say: |-
    <en>"*Good evening*"</en><vi> [long pause] là chào buổi tối — chúng ta dùng chào nhau lúc gặp nhau vào buổi tối.</vi>
    <en>Listen first! [long pause] "*Good evening*"</en>
    <en>Your turn now! [long pause] "*Good evening*"!</en>
  learner_goal: Học sinh nói Good evening bằng tiếng Anh để chào khi gặp vào buổi tối; Good night là lời chúc khi
    chia tay nên chưa đạt.
  image_url: /images/grade-03/unit-01/lesson-01/V05_good_evening.webp
- type: practice
  say: |-
    <vi>Khi gặp ai LẦN ĐẦU, con nói </vi><en>[long pause] "*Nice to meet you*"</en>
    <vi> [long pause] — nghĩa là rất vui được gặp bạn.</vi>
    <en>Listen first! [long pause] "*NICE TO MEET YOU*"</en>
    <en>Your turn now! [long pause] "*Nice to meet you*"!</en>
  learner_goal: Học sinh nói đủ cụm Nice to meet you bằng tiếng Anh; không đánh giá nối âm từ transcript chữ.
  image_url: /images/grade-03/unit-01/lesson-01/V06_nice_to_meet_you.webp
- type: practice
  say: |-
    <vi>Cô đố con trò Mật mã hai cửa nhé! [long pause]</vi>
    <vi>Cửa thứ nhất: con gặp một bạn thân. Cửa thứ hai: con gặp cô Luna vào buổi tối. [long pause]</vi>
    <vi>Con nói hai lời chào phù hợp theo đúng thứ tự để mở cả hai cửa nào!</vi>
  learner_goal: 'Học sinh nói hai lời chào theo đúng thứ tự: Hi hoặc Hello cho bạn thân, rồi Good evening khi gặp
    Luna buổi tối. Thiếu một lời chào hoặc đảo thứ tự thì chưa đạt.'
  image_url: /images/grade-03/unit-01/lesson-01/G01_two_door_greeting.webp
- type: practice
  say: |-
    <vi>Có từ rồi, giờ cô trò mình ghép từ thành câu — con sẽ biết nói câu này vào lúc nào. [long pause]</vi>
    <vi>Khi gặp một bạn mới, con chào rồi nói tên của con. </vi><en>Listen first! [long pause] "Hi. I'm Mai."</en>
    <en>Your turn now! Can you say: [long pause] "Hi. I'm Mai."?</en>
  learner_goal: Học sinh nói lời chào Hi hoặc Hello rồi giới thiệu đúng tên Mai bằng I'm Mai như mẫu đang luyện.
    Chỉ nói Mai hoặc dùng I'm với tên khác thì chưa đạt mẫu này.
  image_url: /images/grade-03/unit-01/lesson-01/V03_im_mai.webp
- type: practice
  say: <en>Listen first! [long pause] "Hello. I'm Minh." [long pause] Your turn now!</en>
  learner_goal: Học sinh nói lời chào Hi hoặc Hello rồi giới thiệu đúng tên Minh bằng I'm Minh như mẫu vừa nghe.
    Chỉ nói tên riêng thì chưa đạt.
- type: practice
  say: <en>Now say YOUR name! [long pause] "Hi. I'm Luna." Your turn!</en>
  learner_goal: Học sinh giới thiệu tên thật hoặc tên tự chọn của mình bằng I'm [tên]; có thể thêm Hi hoặc Hello
    ở đầu. Không coi Luna là tên học sinh chỉ vì mẫu nói I'm Luna.
- type: practice
  say: |-
    <vi>Khi bạn chào con trước, con chào lại, gọi tên bạn, rồi nói tên con. </vi><en>Listen first! [long pause] "Hello, Ben. I'm Mai."</en>
    <en>Your turn now!</en>
  learner_goal: Học sinh đáp lời chào của Ben và tự giới thiệu tên bằng I'm [tên], ví dụ Hello, Ben. I'm Mai. Tên
    của học sinh có thể tự chọn.
  image_url: /images/grade-03/unit-01/lesson-01/V04_ben_mai_minh.webp
- type: practice
  say: |-
    <en>Now I'm going to play a character — I'm Tom from England! [long pause]</en>
    <en>[long pause] "Hi. I'm Tom."</en>
  learner_goal: Học sinh đáp nhân vật Tom bằng Hi hoặc Hello rồi giới thiệu tên mình bằng I'm [tên]. Gọi Tom là
    điểm cộng, không bắt buộc; chỉ lặp I'm Tom thì chưa phải giới thiệu mình.
  image_url: /images/grade-03/unit-01/lesson-01/C01_tom.webp
- type: practice
  say: <en>Now I'm Emma from England! [long pause] "Hello. I'm Emma."</en>
  learner_goal: Học sinh đáp nhân vật Emma bằng Hi hoặc Hello rồi giới thiệu tên mình bằng I'm [tên]. Có thể gọi
    Emma; không nhận I'm Emma như tên của học sinh nếu chỉ lặp mẫu.
  image_url: /images/grade-03/unit-01/lesson-01/C02_emma.webp
- type: narration
  say: <en>Scene done! You just had a real conversation in English!</en>
  image_url: /images/grade-03/unit-01/lesson-01/F01_praise_star.webp
- type: practice
  say: '<vi>Bây giờ đổi vai — con là người chào cô trước nhé! </vi><en>Say: [long pause] "Hi. I''m…"</en>'
  learner_goal: Học sinh tự mở lời với Luna bằng Hi hoặc Hello và I'm [tên học sinh tự chọn]. Câu cần có phần giới
    thiệu tên, không chỉ lời chào.
  image_url: /images/grade-03/unit-01/lesson-01/F02_your_turn_microphone.webp
- type: narration
  say: <en>[long pause] "Hi! I'm Luna. Nice to meet you!"</en>
- type: practice
  say: |-
    <vi>Giờ con nói chuyện thật với cô bằng tiếng Anh nhé — cô luôn giúp con! [long pause]</vi>
    <en>Let's meet again — all in English! Ready? [long pause]</en>
    <en>[long pause] "Good evening!"</en>
  learner_goal: Học sinh đáp lời chào Good evening của Luna bằng Good evening, Hello hoặc Hi. Một lời tạm biệt chưa
    đạt.
  image_url: /images/grade-03/unit-01/lesson-01/S06_evening_video_call.webp
- type: practice
  say: <en>[long pause] "I'm Luna."</en>
  learner_goal: Học sinh chào Luna và giới thiệu tên mình bằng I'm [tên học sinh tự chọn]. Không chấp nhận chỉ lặp
    I'm Luna như lời của học sinh.
- type: practice
  say: <en>[long pause] "Hi! Nice to meet you."</en>
  learner_goal: Học sinh đáp lời gặp mặt bằng Nice to meet you hoặc Nice to meet you, too; có thể gọi tên Luna.
- type: narration
  say: <en>Wow! That was your first English conversation! </en>
- type: practice
  say: <en>Now YOU start! Say hello to me first.</en>
  learner_goal: Học sinh chủ động chào Luna bằng Hi hoặc Hello; có thể giới thiệu tên mình bằng I'm [tên học sinh
    tự chọn], nhưng không bắt buộc.
- type: practice
  say: <en>[long pause] "Good evening! I'm Luna. Nice to meet you!"</en>
  learner_goal: Học sinh đáp lời Luna bằng Nice to meet you hoặc Nice to meet you, too; có thể thêm lời chào.
- type: end
  say: <en>Great work today!</en>
cards:
- word: hello
  pronunciation: /həˈloʊ/
  meaning_vi: xin chào
  image_url: /images/grade-03/unit-01/lesson-01/V01_hello.webp
- word: hi
  pronunciation: /haɪ/
  meaning_vi: chào
  image_url: /images/grade-03/unit-01/lesson-01/V02_hi.webp
- word: I
  pronunciation: /aɪ/
  meaning_vi: tôi, mình
  image_url: /images/grade-03/unit-01/lesson-01/V03_im_mai.webp
- word: I'm
  pronunciation: /aɪm/
  meaning_vi: mình là
  image_url: /images/grade-03/unit-01/lesson-01/V03_im_mai.webp
- word: good evening
  pronunciation: /ˌɡʊd ˈiːvnɪŋ/
  meaning_vi: chào buổi tối
  image_url: /images/grade-03/unit-01/lesson-01/V05_good_evening.webp
- word: nice to meet you
  pronunciation: /naɪs tə ˈmiːt juː/
  meaning_vi: rất vui được gặp bạn
  image_url: /images/grade-03/unit-01/lesson-01/V06_nice_to_meet_you.webp
patterns:
- "Hi. I'm Mai."
- "Hello. I'm Minh."
- "Hi! Nice to meet you."
