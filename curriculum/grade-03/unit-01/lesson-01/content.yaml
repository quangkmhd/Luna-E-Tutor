lesson: 1
title: Chào hỏi và giới thiệu tên
greeting:
  order: 1
  say: |-
    <en>Hi! My name is Luna. I'm your English tutor!</en>
    <vi>[long pause] Xin chào con! Cô là Luna, gia sư tiếng Anh của con.</vi>
    <vi> We're going to practice English together. Ready?</vi>
  accept: Con đáp lại bằng Hi hoặc Hello; có thể gọi tên cô Luna. Một câu chào ngắn cũng đạt.
  image_url: /images/grade-03/unit-01/lesson-01/01-hello-and-greetings.webp
words:
- hello
- hi
- I
- I'm
- Ben
- Mai
- Minh
- good evening
- nice to meet you
cards:
- word: hello
  pronunciation: /həˈloʊ/
  meaning_vi: xin chào
  image_url: /images/grade-03/unit-01/lesson-01/01-hello-and-greetings.webp
- word: hi
  pronunciation: /haɪ/
  meaning_vi: chào
  image_url: /images/grade-03/unit-01/lesson-01/01-hello-and-greetings.webp
- word: I
  pronunciation: /aɪ/
  meaning_vi: tôi, mình
  image_url: /images/grade-03/unit-01/lesson-01/02-self-introduction.webp
- word: I'm
  pronunciation: /aɪm/
  meaning_vi: mình là
  image_url: /images/grade-03/unit-01/lesson-01/02-self-introduction.webp
- word: good evening
  pronunciation: /ˌɡʊd ˈiːvnɪŋ/
  meaning_vi: chào buổi tối
  image_url: /images/grade-03/unit-01/lesson-01/03-time-of-day-greetings.webp
- word: nice to meet you
  pronunciation: /naɪs tə ˈmiːt juː/
  meaning_vi: rất vui được gặp bạn
  image_url: /images/grade-03/unit-01/lesson-01/04-first-meeting.webp
patterns:
  introduce: Hello./Hi. I'm {name}.
  reply: Hello,/Hi, {friend}. I'm {name}.
stations:
- id: vocabulary
  steps:
  - order: 2
    target: hello
    image_url: /images/grade-03/unit-01/lesson-01/01-hello-and-greetings.webp
    say: |-
      <vi>Cô trò mình sang Trạm 1 học từ mới. Mỗi từ, cô nói nghĩa rồi đọc trước, con đọc theo cô nhé!</vi>
      <en>[long pause] "*HELLO*"</en><vi> nghĩa là xin chào, con nói khi gặp bất kỳ ai như bạn bè, thầy cô, hay cô Luna.</vi>
      <en>[long pause] Listen first! [long pause] "*HELLO*" </en>
      <en>[long pause] Your turn now! Can you say: [long pause] [slowly] "*Hello*"?</en>
    accept: hello (có /h/)
    more:
    - say: |-
        <en>Once more! [long pause] "Hello"</en>
      accept: hello
    - say: |-
        <vi>Cô phát âm chậm nhé: </vi>
        <en>[long pause] "H-HELLO"</en><vi> </vi>
        <vi>[long pause] Con đặt tay trước miệng thấy hơi ấm phả ra không? Đó là âm giống như một hơi thở. [long pause]</vi>
        <en>Now you!</en>
      accept: Có /h/ rõ
  - order: 3
    target: hi
    image_url: /images/grade-03/unit-01/lesson-01/01-hello-and-greetings.webp
    say: |-
      <en>[long pause] "*Hi*"</en><vi> [long pause] cũng là xin chào, nhưng ngắn và thân mật hơn, con dùng với bạn bè.</vi>
      <en>Listen first! [long pause] "*Hi*"</en>
      <en>Your turn now! [long pause][slowly] "*Hi*"</en>
    accept: hi
  - order: 4
    target: I'm
    image_url: /images/grade-03/unit-01/lesson-01/02-self-introduction.webp
    say: |-
      <en>[long pause] "I"</en><vi> [long pause] nghĩa là mình khi con nói về chính con.</vi>
      <en>[long pause] "*I'm*"</en><vi> [long pause] nghĩa là 'mình là'. Cuối chữ, con ngậm môi lại:</vi>
      <en>[long pause] "I'mm"</en>
      <en>Listen first! [long pause] "*I'm*"</en>
      <en>Your turn now! Can you say: [long pause][slowly] "*I'm*"?</en>
    accept: Có /m/ cuối
  - order: 5
    target: good evening
    image_url: /images/grade-03/unit-01/lesson-01/03-time-of-day-greetings.webp
    say: |-
      <en>"*Good evening*"</en><vi> [long pause] là chào buổi tối — chúng ta dùng chào nhau lúc gặp nhau vào buổi tối.</vi>
      <en>Listen first! [long pause] "*Good evening*"</en>
      <en>Your turn now! [long pause] "*Good evening*"!</en>
    accept: good evening
  - order: 6
    target: nice to meet you
    image_url: /images/grade-03/unit-01/lesson-01/04-first-meeting.webp
    say: |-
      <vi>Khi gặp ai LẦN ĐẦU, con nói </vi><en>[long pause] "*Nice to meet you*"</en>
      <vi> [long pause] — nghĩa là rất vui được gặp bạn.</vi>
      <en>Listen first! [long pause] "*NICE TO MEET YOU*"</en>
      <en>Your turn now! [long pause] "*Nice to meet you*"!</en>
    accept: Đủ cụm, nối âm chưa chuẩn vẫn đạt
  - order: 7
    target: [hi, good evening]
    say: |-
      <vi>Cô đố con trò Mật mã hai cửa nhé! [long pause]</vi>
      <vi>Cửa thứ nhất: con gặp một bạn thân. Cửa thứ hai: con gặp cô Luna vào buổi tối. [long pause]</vi>
      <vi>Con nói hai lời chào phù hợp theo đúng thứ tự để mở cả hai cửa nào!</vi>
    accept: Cửa 1 chấp nhận Hi hoặc Hello; cửa 2 chấp nhận Good evening. Con nói được cả hai lời chào theo đúng thứ tự thì đạt; không cần thêm câu khác.
- id: patterns
  steps:
  - order: 8
    target: introduce
    say: |-
      <vi>Có từ rồi, giờ cô trò mình ghép từ thành câu — con sẽ biết nói câu này vào lúc nào. [long pause]</vi>
      <vi>Khi gặp một bạn mới, con chào rồi nói tên của con. </vi><en>Listen first! [long pause] "Hi. I'm Mai."</en>
      <en>Your turn now! Can you say: [long pause] "Hi. I'm Mai."?</en>
    accept: Hi/Hello + I'm + Mai
    more:
    - say: |-
        <en>Listen first! [long pause] "Hello. I'm Minh."</en>
      accept: Đủ câu
    - say: |-
        <en>Now say YOUR name! [long pause] "Hi. I'm Luna." Your turn!</en>
      accept: Hi/Hello + I'm + tên. Thiếu Hi vẫn đạt.
  - order: 9
    target: reply
    say: |-
      <vi>Khi bạn chào con trước, con chào lại, gọi tên bạn, rồi nói tên con. </vi><en>Listen first! [long pause] "Hello, Ben. I'm Mai."</en>
      <en>Your turn now!</en>
    accept: Đủ câu
  - order: 10
    target: reply
    say: |-
      <en>Now I'm going to play a character — I'm Tom from England! [long pause]</en>
      <en>[long pause] "Hi. I'm Tom."</en>
    accept: Hi/Hello + Tom + I'm + tên. Quên gọi 'Tom' vẫn đạt.
    more:
    - say: |-
        <en>Now I'm Emma from England! [long pause] "Hello. I'm Emma."</en>
      accept: Đủ các thành phần
    - say: |-
        <en>Scene done! You just had a real conversation in English!</en>
  - order: 11
    target: introduce
    say: |-
      <vi>Bây giờ đổi vai — con là người chào cô trước nhé! </vi><en>Say: [long pause] "Hi. I'm…"</en>
    accept: Tự mở lời bằng câu trọn vẹn
    more:
    - say: |-
        <en>[long pause] "Hi, {tên}! I'm Luna. Nice to meet you!"</en>
- id: conversation
  steps:
  - order: 12
    target: introduce
    say: |-
      <vi>Giờ con nói chuyện thật với cô bằng tiếng Anh nhé — cô luôn giúp con! [long pause]</vi>
      <en>Let's meet again — all in English! Ready? [long pause]</en>
      <en>[long pause] "Good evening!"</en>
    accept: Good evening / Hello / Hi (đều đạt)
    more:
    - say: |-
        <en>[long pause] "I'm Luna."</en>
      accept: Gọi tên Luna + I'm + tên
    - say: |-
        <en>[long pause] "Hi, {tên}! Nice to meet you."</en>
      accept: 'Nice to meet you (Mức 3: …, too)'
    - say: |-
        <en>Wow! That was your first English conversation! </en>
  - order: 13
    target: introduce
    say: |-
      <en>Now YOU start! Say hello to me first.</en>
    accept: Chào + I'm + tên
    more:
    - say: |-
        <en>[long pause] "Good evening, {tên}! I'm Luna. Nice to meet you!"</en>
      accept: 'Mức 2: Nice to meet you · Mức 3: …, too'
