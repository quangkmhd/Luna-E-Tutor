lesson: 1
title: Chào hỏi và giới thiệu tên
greeting:
  order: 1
  say: |-
    Hi! My name is Luna — I'm your English tutor! [long pause]
    Xin chào con! Cô là Luna, gia sư tiếng Anh của con. Con chào cô nhé!
  accept: Con đáp lại bằng Hi hoặc Hello; có thể gọi tên cô Luna. Một câu chào ngắn cũng đạt.
words:
- hello
- hi
- I
- I'm
- Ben
- Mai
- Minh
- good evening
- nice to meet you
patterns:
  introduce: Hello./Hi. I'm {name}.
  reply: Hello,/Hi, {friend}. I'm {name}.
stations:
- id: vocabulary
  steps:
  - order: 2
    target: hello
    say: |-
      Cô trò mình sang Trạm 1 — học từ mới. Mỗi từ, cô nói nghĩa rồi đọc trước, con đọc theo cô nhé! [long pause]
      HELLO nghĩa là xin chào — con nói khi gặp bất kỳ ai: bạn bè, thầy cô, hay cô Luna. [long pause]
      Listen first! HELLO. [long pause]
      Your turn now! Can you say: Hello?
    accept: hello (có /h/)
    more:
    - say: |-
        Once more! Hello.
      accept: hello
    - say: |-
        Cô phát âm chậm nhé: H-H-HELLO. Con đặt tay trước miệng — thấy hơi ấm phả ra không? Đó là âm /h/, giống như một hơi thở. [long pause]
        Now you!
      accept: Có /h/ rõ
  - order: 3
    target: hi
    say: |-
      Hi cũng là xin chào, nhưng ngắn và thân mật hơn — con dùng với bạn bè. [long pause]
      Listen first! HI. [long pause]
      Your turn now! Hi!
    accept: hi
  - order: 4
    target: I'm
    say: |-
      I nghĩa là mình — khi con nói về chính con. I'm nghĩa là 'mình là'. Cuối chữ, con ngậm môi lại: I'mmm. [long pause]
      Listen first! I'M. [long pause]
      Your turn now! Can you say: I'm?
    accept: Có /m/ cuối
  - order: 5
    target: [Ben, Mai, Minh]
    say: |-
      Meet your book friends: Ben, Mai, Minh!
    accept: Đọc được tên
  - order: 6
    target: good evening
    say: |-
      Good evening là chào buổi tối — chúng ta dùng chào nhau lúc gặp nhau vào buổi tối. [long pause]
      Listen first! GOOD EVENING. [long pause]
      Your turn now! Good evening!
    accept: good evening
  - order: 7
    target: nice to meet you
    say: |-
      Khi gặp ai LẦN ĐẦU, con nói Nice to meet you — nghĩa là rất vui được gặp bạn. [long pause]
      Listen first! NICE TO MEET YOU. [long pause]
      Your turn now! Nice to meet you!
    accept: Đủ cụm, nối âm chưa chuẩn vẫn đạt
  - order: 8
    say: |-
      Let's play! Clap when you hear a greeting. [long pause]
      Hello… one… hi… book… good evening… ten. [long pause]
      Which greetings did you hear?
    accept: Con nêu hello, hi, good evening; đúng ít nhất 2 trong 3 lời chào vẫn đạt.
- id: patterns
  steps:
  - order: 9
    target: introduce
    say: |-
      Có từ rồi, giờ cô trò mình ghép từ thành câu — con sẽ biết nói câu này vào lúc nào. [long pause]
      Khi gặp một bạn mới, con chào rồi nói tên của con. Listen first! Hi. I'm Mai. [long pause]
      Your turn now! Can you say: Hi. I'm Mai?
    accept: Hi/Hello + I'm + Mai
    more:
    - say: |-
        Listen first! Hello. I'm Minh.
      accept: Đủ câu
    - say: |-
        Now say YOUR name! Hi. I'm Luna. Your turn!
      accept: Hi/Hello + I'm + tên. Thiếu Hi vẫn đạt.
  - order: 10
    target: reply
    say: |-
      Khi bạn chào con trước, con chào lại, gọi tên bạn, rồi nói tên con. Listen first! Hello, Ben. I'm Mai. [long pause]
      Your turn now!
    accept: Đủ câu
  - order: 11
    target: reply
    say: |-
      Now I'm going to play a character — I'm Tom from England! [long pause]
      Hi. I'm Tom.
    accept: Hi/Hello + Tom + I'm + tên. Quên gọi 'Tom' vẫn đạt.
    more:
    - say: |-
        Now I'm Emma from England! Hello. I'm Emma.
      accept: Đủ các thành phần
    - say: |-
        Scene done! You just had a real conversation in English! 🎉
  - order: 12
    target: introduce
    say: |-
      Bây giờ đổi vai — con là người chào cô trước nhé! Say: Hi. I'm…
    accept: Tự mở lời bằng câu trọn vẹn
    more:
    - say: |-
        Hi, {tên}! I'm Luna. Nice to meet you!
- id: conversation
  steps:
  - order: 13
    target: introduce
    say: |-
      Giờ con nói chuyện thật với cô bằng tiếng Anh nhé — cô luôn giúp con! [long pause]
      Let's meet again — all in English! Ready? [long pause]
      Good evening!
    accept: Good evening / Hello / Hi (đều đạt)
    more:
    - say: |-
        I'm Luna.
      accept: Gọi tên Luna + I'm + tên
    - say: |-
        Hi, {tên}! Nice to meet you.
      accept: 'Nice to meet you (Mức 3: …, too)'
    - say: |-
        Wow! That was your first English conversation! 🎉
  - order: 14
    target: introduce
    say: |-
      Now YOU start! Say hello to me first.
    accept: Chào + I'm + tên
    more:
    - say: |-
        Good evening, {tên}! I'm Luna. Nice to meet you!
      accept: 'Mức 2: Nice to meet you · Mức 3: …, too'
