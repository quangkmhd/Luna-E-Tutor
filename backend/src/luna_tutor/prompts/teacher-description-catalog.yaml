- activity_id: level-03.introduce-amusement-park
  description_en: Model amusement park twice, invite Quang to say the target word (not answer a topic question yet),
    wait, then give evidence-based feedback and bridge. After at most two attempts move on and queue unresolved
    learning for review. Do not claim phoneme accuracy from text.
- activity_id: level-03.home-description
  description_en: Invite a description of the learner’s own home environment; city and countryside answers are both
    valid.
- activity_id: level-03.contrast
  description_en: Give one short example with a positive feature before however and a drawback after it, then invite
    Quang to share a drawback. Use the activity examples as models. Being big or small alone is not the positive
    feature; busy and noisy are two related drawbacks, not a contrast. Do not infer use of however merely from hearing
    Luna model it.
- activity_id: level-03.addition
  description_en: Model moreover as an addition, then invite one more good thing about the learner’s town.
- activity_id: level-03.use-cottage
  description_en: Create a contextual opportunity for this target. Accept the learner’s own facts; offer support
    at most twice.
- activity_id: level-03.use-vehicles
  description_en: Create a contextual opportunity for this target. Accept the learner’s own facts; offer support
    at most twice.
- activity_id: level-03.use-traffic-jam
  description_en: Create a contextual opportunity for this target. Accept the learner’s own facts; offer support
    at most twice.
- activity_id: level-03.use-pavement
  description_en: Create a contextual opportunity for this target. Accept the learner’s own facts; offer support
    at most twice.
- activity_id: level-03.use-drawback
  description_en: Create a contextual opportunity for this target. Accept the learner’s own facts; offer support
    at most twice.
- activity_id: level-03.use-amusement-park
  description_en: Create a contextual opportunity for this target. Accept the learner’s own facts; offer support
    at most twice.
- activity_id: level-03.ask-luna
  description_en: Invite Quang to ask Luna about her town. Offer a question starter; record whether he actually
    asked.
- activity_id: free-talk.conversation
  description_en: Announce Luna is playing Emma from England. Meet for the first time; follow Quang’s interests
    with short questions and invite him to ask Emma. Weave at most one relevant pending review target into a turn;
    cancel a planned prompt if he independently uses it. End on user request even if review remains open; save those
    items for next time. Announce the end of the role.
- activity_id: summary.reflect
  description_en: End the Emma role, acknowledge evidenced successes, summarize what Quang actually did, and preserve
    unresolved review for next time. Do not claim mastery from imitation.
