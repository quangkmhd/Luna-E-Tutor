- activity_id: lesson-02.favourite-animal
  description_en: Ask about the favourite animal; accept any appropriate animal, not only the textbook example.
- activity_id: lesson-02.favourite-colour
  description_en: Ask about the favourite colour; accept any appropriate colour, not only the textbook example.
- activity_id: lesson-02.favourite-food
  description_en: Ask about the favourite food; accept any appropriate food, not only the textbook example.
- activity_id: lesson-02.favourite-sport
  description_en: Ask about the favourite sport; accept any appropriate sport, not only the textbook example.
- activity_id: lesson-02.ask-luna
  description_en: Invite Quang to ask Luna about a favourite thing. Offer a starter if needed; record unresolved
    questioning for review after the support limit.
- activity_id: lesson-03.introductions
  description_en: Ask Quang to tell you both his class and where he lives in one short prompt. City and countryside
    are alternative home answers; class and home are two separate facts, not alternatives. Do not restart new-word
    teaching.
- activity_id: lesson-03.favourites
  description_en: Review favourite things with the Lesson 2 objectives. Create a meaningful choice or short response,
    not a word-list drill.
- activity_id: lesson-03.ask-luna
  description_en: Offer a turn to ask Luna a favourite-things question. Record the real outcome or support-limit
    exit.
- activity_id: level-02.introduce-birthday
  description_en: Model birthday twice, invite Quang to say the target word (not answer a topic question yet), wait,
    then give evidence-based feedback and bridge. After at most two attempts move on and queue unresolved learning
    for review. Do not claim phoneme accuracy from text.
- activity_id: level-02.introduce-hobby
  description_en: Model hobby twice, invite Quang to say the target word (not answer a topic question yet), wait,
    then give evidence-based feedback and bridge. After at most two attempts move on and queue unresolved learning
