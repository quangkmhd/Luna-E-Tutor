- activity_id: level-02.birthday
  description_en: Ask which month Quang's birthday is in, then wait for his answer.
- activity_id: level-02.hobby
  description_en: Ask about a hobby, accepting natural alternatives such as I enjoy playing table tennis.
- activity_id: level-02.subject
  description_en: Ask about a favourite school subject.
- activity_id: level-02.ask-luna
  description_en: Invite Quang to ask Luna about her hobby or birthday month. Do not ask for contact information.
- activity_id: level-03.introduce-cottage
  description_en: Model cottage twice, invite Quang to say the target word (not answer a topic question yet), wait,
