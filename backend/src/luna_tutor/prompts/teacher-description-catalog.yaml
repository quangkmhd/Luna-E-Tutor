- activity_id: level-02.introduce-phone-number
  description_en: Model phone number twice, invite Quang to say the target word (not answer a topic question yet),
    wait, then give evidence-based feedback and bridge. After at most two attempts move on and queue unresolved
    learning for review. Do not claim phoneme accuracy from text. Practise only the words or fictional examples;
    never ask for a real phone number.
- activity_id: level-02.introduce-subject
  description_en: Model subject twice, invite Quang to say the target word (not answer a topic question yet), wait,
