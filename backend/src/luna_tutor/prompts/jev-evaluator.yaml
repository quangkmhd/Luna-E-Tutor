response_kind:
  type: choice
  instructions: >-
    Classify the learner's immediate response to Luna's current turn. Judge the learner text,
    not Luna's words. Use insufficient_data only when transcript_status is not final, an STT
    or audio issue is reported, the transcript is empty, or its content truly cannot be
    interpreted. In a scripted lesson, a short recitation of the requested word or phrase
    is an answer, even if it is only one word or repeats the Teacher's model. A learner can
    answer a speaking prompt correctly without demonstrating independent word meaning;
    meaning_status=not_demonstrated does not make the response insufficient_data. Keep this
    choice consistent with objective evidence: if a reliable answer demonstrates the current
    target form or satisfies the objective, do not classify that same answer as insufficient_data.
  criteria:
    answer: The learner is answering or attempting the requested learning prompt.
    asks_meaning: The learner asks what a word, phrase, or sentence means.
    asks_teacher: The learner asks Luna a question that is not merely a request for meaning.
    off_topic: The learner gives a usable response about an unrelated topic.
    does_not_know: The learner explicitly says they do not know or cannot answer.
    insufficient_data: The transcript is empty, incomplete, affected by an STT or audio issue, or genuinely uninterpretable; a short assessable answer is not insufficient.
emotional_signal:
  type: noul
  instructions: Does the learner express tiredness, sadness, fear, frustration, or another emotional need that Luna should acknowledge?
  criteria:
    true: The learner explicitly communicates an emotional need.
    false: No emotional need is expressed.
needs_clarification:
  type: noul
  instructions: >-
    Is the learner input genuinely too ambiguous or incomplete to assess safely? Set true
    for an incomplete or uncertain transcript, an STT or audio issue, empty text, or content
    whose intended response cannot be determined. Set false for a final, reliable, assessable
    answer, including a one-word recitation in a scripted lesson. Do not mistake shortness,
    repetition after a model, missing independent meaning evidence, or an ordinary learner
    mistake for input uncertainty. If the current answer demonstrates the target form or
    satisfies the objective and the transcript is reliable, set false. Keep this decision
    consistent with response_kind: insufficient_data requires true; an assessable answer
    requires false.
  criteria:
    true: Transcript reliability or genuine ambiguity prevents assessment; ask the learner to clarify.
    false: The learner's response can be assessed, including a short recitation or an incorrect attempt.
objective_meaning:
  type: choice
  instructions: Judge whether the learner communicates this objective's meaning. Meaning is separate from exact English form and may be communicated in Vietnamese. In a scripted lesson, evidence_criteria describes what is accepted; if it requires several parts or an order, mark satisfied only when every required part is present in that order, except omissions explicitly allowed by the criterion. A relevant but incomplete answer is partially_satisfied, not satisfied. When Luna only asks the learner to say a vocabulary word, exact word imitation alone does not demonstrate independent understanding; mark meaning not_demonstrated while assessing the word separately under objective_form.
  criteria:
    satisfied: The requested idea is communicated clearly enough.
    partially_satisfied: A relevant part of the requested idea is communicated, but an essential detail is missing.
    wrong_semantic_category: The response supplies the wrong kind of answer, such as a colour when an animal is requested.
    not_demonstrated: The response gives no usable evidence for this objective.
    uncertain: Transcript quality or ambiguity prevents a safe judgement.
objective_form:
  type: choice
  instructions: Judge only the learner's use of the current target English. In a vocabulary_introduction, exact word imitation of a target_word is correct_target_form even when meaning is not_demonstrated; never mark that word not_used merely because it is a one-word reply. If the current speaking prompt asks for a whole multiword phrase or multiple greetings, one word or one part alone is not the correct target form. Do not mark correct_target_form merely because one target word appears inside an incomplete multi-part answer. A correct idea in Vietnamese or a one-word answer does not demonstrate a full target sentence pattern.
  criteria:
    correct_target_form: The learner uses the target word or pattern correctly.
    valid_alternative: The learner uses grammatical English that communicates the goal without using the target form.
    error_in_target_form: The learner attempts the target English but makes a correctable grammar or word-choice error while the intended meaning is known.
    not_used: The learner does not use the target English, including a Vietnamese-only or short non-pattern answer.
    uncertain: Transcript quality or ambiguity prevents a safe judgement.
objective_recast:
  type: noul
  instructions: Does Luna need to naturally restate this learner answer with a minimal grammar or word-choice correction? Never recast a meaning question, silence, Vietnamese-only answer, or wrong semantic category. Do not decide the correction wording.
  criteria:
    true: The learner expressed a known meaning in English with a correctable target-form error.
    false: No natural correction is needed.
