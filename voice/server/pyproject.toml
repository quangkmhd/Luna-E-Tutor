[project]
name = "voice"
version = "0.1.0"
description = "Voice AI bot built with Pipecat"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[openrouter,runner,soniox,webrtc]==1.11.0",
    "luna-tutor",
]

[dependency-groups]
dev = [
    "pipecat-ai[evals]==1.11.0",
    "pytest",
    "pytest-asyncio",
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
    "respx>=0.22,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]

[tool.uv.sources]
luna-tutor = { path = "../../backend", editable = true }
