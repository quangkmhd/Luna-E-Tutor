name: luna_unit1_soniox_audio

# Full mouth-and-ears path: local Kokoro synthesizes learner audio, the bot's
# configured Soniox STT/TTS handle the live path, and Moonshine transcribes the
# teacher audio for deterministic response events.
user:
  modality: audio
  speech:
    service: kokoro
    voice: af_heart
    sample_rate: 16000

judge:
  modality: audio
  transcription:
    service: moonshine
    model: small-streaming

trigger_disconnect: true

scenarios:
  - name: bilingual_lesson_and_barge_in
    turns:
      - expect:
          - event: response

      - user: "I am happy today."
        expect:
          - event: user_transcription
            text_contains: "happy"
          - event: response

      - user: "Em sống ở the countryside."
        expect:
          - event: user_transcription
          - event: response

      - user: "I live in the countryside, and although the road is busy, I like the trees, the fresh air, and the quiet evenings near my home."
        expect:
          - event: user_transcription
          - event: llm_started

      - user: "Sorry, I want to say my favourite animal is a rabbit."
        send_after: {event: llm_started, delay_ms: 0}
        expect:
          - event: bot_interrupted
          - event: response
