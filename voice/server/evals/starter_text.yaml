name: luna_unit1_text

# Fast brain-path check. Start bot.py with -t eval and a --runner-body JSON
# containing a real session_id. Text mode bypasses Soniox; starter_audio.yaml
# verifies the complete STT/TTS path.
scenarios:
  - name: teaching_decisions
    turns:
      - user: "I am happy today."
        expect:
          - event: response

      - user: "Em chưa hiểu câu hỏi. Cô nói lại bằng tiếng Anh chậm hơn nhé."
        expect:
          - event: response

      - user: "My favourite game is football, but I do not know the answer."
        expect:
          - event: response
