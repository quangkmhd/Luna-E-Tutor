services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: luna-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - TUTOR_DATABASE_PATH=/app/backend/data/luna-tutor.sqlite3
    ports:
      - "${BACKEND_PORT:-8090}:8000"
    volumes:
      - backend_data:/app/backend/data
    networks:
      - luna-network

  voice:
    build:
      context: .
      dockerfile: voice/Dockerfile
    container_name: luna-voice
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PIPECAT_ALLOWED_ORIGINS=${PIPECAT_ALLOWED_ORIGINS:-*}
      - PIPECAT_ICE_SERVERS=${PIPECAT_ICE_SERVERS:-}
      - TUTOR_DATABASE_PATH=/app/backend/data/luna-tutor.sqlite3
    volumes:
      - backend_data:/app/backend/data
    network_mode: host

  talk:
    build:
      context: .
      dockerfile: talk/Dockerfile
    container_name: luna-talk
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PIPECAT_ALLOWED_ORIGINS=${PIPECAT_ALLOWED_ORIGINS:-*}
      - PIPECAT_ICE_SERVERS=${PIPECAT_ICE_SERVERS:-}
    network_mode: host

  nginx:
    image: nginx:alpine
    container_name: luna-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - voice
      - talk
    networks:
      - luna-network
    profiles:
      - standalone-nginx

  # Web frontend service running on VPS
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        - NEXT_PUBLIC_TUTOR_API_URL=${NEXT_PUBLIC_TUTOR_API_URL:-}
        - NEXT_PUBLIC_PIPECAT_URL=${NEXT_PUBLIC_PIPECAT_URL:-/voice-bot}
        - NEXT_PUBLIC_TALK_PIPECAT_URL=${NEXT_PUBLIC_TALK_PIPECAT_URL:-/talk-bot}
    container_name: luna-web
    restart: unless-stopped
    environment:
      - VPS_HOST=http://14.225.204.45
      - BACKEND_PORT=8090
      - VOICE_PORT=7860
      - TALK_PORT=7863
    ports:
      - "${WEB_PORT:-3001}:3000"
    networks:
      - luna-network

  # Cloudflare Tunnel for instant public HTTPS without custom domain
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: luna-tunnel
    restart: unless-stopped
    command: tunnel --protocol http2 --no-autoupdate --url http://web:3000
    depends_on:
      - web
    networks:
      - luna-network

networks:
  luna-network:
    driver: bridge

volumes:
  backend_data:


